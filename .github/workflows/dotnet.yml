name: CarShare Build and Tests

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.202"

      - name: Restore dependencies
        run: dotnet restore CarShare.sln

      - name: Build solution
        run: dotnet build CarShare.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test CarShare.sln --configuration Release --no-build